services:
  - type: web
    name: ember-restaurant
    runtime: node
    plan: free
    branch: development
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/menu-items
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.1
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD
        sync: false