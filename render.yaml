services:
  - type: web
    name: ember-restaurant
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/menu-items
    disk:
      name: ember-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/db.json
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD
        sync: false